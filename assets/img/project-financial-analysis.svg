<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a202d" />
      <stop offset="100%" stop-color="#102c3d" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075b4d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#075b4d" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a85b" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#075b4d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad1)" />

  <!-- Subtle Financial Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="80" x2="560" y2="80" />
    <line x1="40" y1="140" x2="560" y2="140" />
    <line x1="40" y1="200" x2="560" y2="200" />
    <line x1="40" y1="260" x2="560" y2="260" />
    <line x1="40" y1="320" x2="560" y2="320" />
    <line x1="120" y1="60" x2="120" y2="340" />
    <line x1="220" y1="60" x2="220" y2="340" />
    <line x1="320" y1="60" x2="320" y2="340" />
    <line x1="420" y1="60" x2="420" y2="340" />
    <line x1="520" y1="60" x2="520" y2="340" />
  </g>

  <!-- Top Institutional Bar -->
  <rect x="40" y="32" width="220" height="26" rx="3" fill="#075b4d" fill-opacity="0.4" stroke="#075b4d" stroke-width="1"/>
  <text x="52" y="49" fill="#e9f1ed" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DUPONT RATIO ANALYSIS</text>
  
  <rect x="460" y="32" width="100" height="26" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="475" cy="45" r="4" fill="#4ade80" />
  <text x="486" y="49" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600">ROE: 31.5%</text>

  <!-- Area Chart fill -->
  <path d="M 60 280 Q 140 250 200 220 T 320 180 T 420 130 T 540 95 L 540 320 L 60 320 Z" fill="url(#greenGrad)" />
  
  <!-- Line Chart Trend -->
  <path d="M 60 280 Q 140 250 200 220 T 320 180 T 420 130 T 540 95" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Data Nodes -->
  <circle cx="200" cy="220" r="5" fill="#102c3d" stroke="#c8a85b" stroke-width="2.5" />
  <circle cx="320" cy="180" r="5" fill="#102c3d" stroke="#4ade80" stroke-width="2.5" />
  <circle cx="420" cy="130" r="5" fill="#102c3d" stroke="#4ade80" stroke-width="2.5" />
  <circle cx="540" cy="95" r="6" fill="#4ade80" stroke="#ffffff" stroke-width="2" />

  <!-- Value Pill at Peak -->
  <rect x="480" y="65" width="70" height="22" rx="3" fill="#102c3d" stroke="#4ade80" stroke-width="1" />
  <text x="492" y="80" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700">+34.8%</text>

  <!-- Metrics Cards Bottom Overlay -->
  <g transform="translate(40, 240)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="155" height="75" rx="4" fill="#0a202d" fill-opacity="0.85" stroke="#dfe4e2" stroke-opacity="0.15" />
    <text x="14" y="24" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">NET MARGIN</text>
    <text x="14" y="52" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700">14.2%</text>
    <text x="85" y="50" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600">+2.4%</text>

    <!-- Metric 2 -->
    <rect x="175" y="0" width="155" height="75" rx="4" fill="#0a202d" fill-opacity="0.85" stroke="#dfe4e2" stroke-opacity="0.15" />
    <text x="189" y="24" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ASSET TURNOVER</text>
    <text x="189" y="52" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700">1.35x</text>
    <text x="260" y="50" fill="#c8a85b" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600">Stable</text>

    <!-- Metric 3 -->
    <rect x="350" y="0" width="170" height="75" rx="4" fill="#0a202d" fill-opacity="0.85" stroke="#dfe4e2" stroke-opacity="0.15" />
    <text x="364" y="24" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">EQUITY MULTIPLIER</text>
    <text x="364" y="52" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700">1.64x</text>
    <text x="440" y="50" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600">Optimal</text>
  </g>
</svg>
