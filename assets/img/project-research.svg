<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a202d" />
      <stop offset="60%" stop-color="#102c3d" />
      <stop offset="100%" stop-color="#075b4d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad4)" />

  <!-- Macro Research Cover / Report Visual -->
