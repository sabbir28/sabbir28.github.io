      <text x="364" y="55" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">AVG. ROE</text>
      <text x="364" y="78" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">12.1%</text>

      <text x="364" y="110" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">CAPITAL ADEQUACY</text>
      <text x="364" y="133" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">11.8%</text>

      <text x="364" y="165" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">COST / INCOME</text>
      <text x="364" y="188" fill="#c8a85b" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">54.2%</text>

      <rect x="364" y="202" width="132" height="20" rx="2" fill="#ffffff" fill-opacity="0.06" />
      <text x="374" y="216" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="9">Basel III Standard</text>
