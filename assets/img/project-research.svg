    <rect x="0" y="0" width="510" height="42" rx="3" fill="#075b4d" fill-opacity="0.35" stroke="#dfe4e2" stroke-opacity="0.15" />
    <text x="20" y="26" fill="#c8a85b" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BANGLADESH INDUSTRIAL &amp; SECTOR RESEARCH</text>
    <rect x="420" y="9" width="75" height="24" rx="2" fill="#075b4d" />
    <text x="432" y="25" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700">Q4 - 2026</text>

    <!-- Main Comparison Grid -->
    <g transform="translate(0, 56)">
      <!-- Sector 1: RMG & Textiles -->
      <rect x="0" y="0" width="160" height="235" rx="4" fill="#0a202d" fill-opacity="0.8" stroke="#dfe4e2" stroke-opacity="0.12" />
      <rect x="0" y="0" width="160" height="32" rx="4" fill="#075b4d" fill-opacity="0.6" />
      <text x="14" y="21" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700">RMG &amp; APPAREL</text>
      
      <text x="14" y="55" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">AVG. ROE</text>
      <text x="14" y="78" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">18.4%</text>

      <text x="14" y="110" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">WORKING CAPITAL</text>
      <text x="14" y="133" fill="#4ade80" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">68 Days</text>

      <text x="14" y="165" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">DEBT / EQUITY</text>
      <text x="14" y="188" fill="#c8a85b" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">1.45x</text>

      <rect x="14" y="202" width="132" height="20" rx="2" fill="#ffffff" fill-opacity="0.06" />
      <text x="24" y="216" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="9">Export Resilient</text>

