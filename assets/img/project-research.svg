      <rect x="175" y="0" width="160" height="235" rx="4" fill="#0a202d" fill-opacity="0.8" stroke="#4ade80" stroke-width="1.2" />
      <rect x="175" y="0" width="160" height="32" rx="4" fill="#075b4d" />
      <text x="189" y="21" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700">PHARMA &amp; HEALTH</text>
      
      <text x="189" y="55" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">AVG. ROE</text>
      <text x="189" y="78" fill="#4ade80" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">22.6%</text>

      <text x="189" y="110" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">OPERATING MARGIN</text>
      <text x="189" y="133" fill="#4ade80" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">24.2%</text>

      <text x="189" y="165" fill="#889da8" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">DEBT / EQUITY</text>
      <text x="189" y="188" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700">0.82x</text>

      <rect x="189" y="202" width="132" height="20" rx="2" fill="#075b4d" fill-opacity="0.8" />
      <text x="199" y="216" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="600">Leading Margin</text>

      <!-- Sector 3: Commercial Banking -->
      <rect x="350" y="0" width="160" height="235" rx="4" fill="#0a202d" fill-opacity="0.8" stroke="#dfe4e2" stroke-opacity="0.12" />
      <rect x="350" y="0" width="160" height="32" rx="4" fill="#075b4d" fill-opacity="0.6" />
