<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102c3d" />
      <stop offset="100%" stop-color="#075b4d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad3)" />

  <!-- Excel / Dashboard Interface Frame -->
  <g transform="translate(40, 25)">
    <!-- Top Formula Bar -->
    <rect x="0" y="0" width="520" height="36" rx="3" fill="#0a202d" stroke="#dfe4e2" stroke-opacity="0.15" />
    <rect x="10" y="7" width="30" height="22" rx="2" fill="#075b4d" />
    <text x="17" y="22" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700">fx</text>
    <text x="50" y="23" fill="#c8a85b" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="500">=XLOOKUP(Quarter_Q4, Budget_Master, Variance_Percent, 0)</text>

    <!-- Split Panels: Left is Mini Pivot, Right is Variance Bar Chart -->
    <!-- Left: Data Pivot -->
    <rect x="0" y="48" width="230" height="270" rx="4" fill="#0a202d" fill-opacity="0.75" stroke="#dfe4e2" stroke-opacity="0.15" />
    <rect x="0" y="48" width="230" height="32" fill="#075b4d" fill-opacity="0.5" />
    <text x="14" y="69" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PIVOT SUMMARY | REGION</text>

    <text x="14" y="105" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="11">North Corporate</text>
    <text x="160" y="105" fill="#4ade80" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="600">$480.2K</text>

    <line x1="14" y1="120" x2="216" y2="120" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="14" y="145" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="11">South Division</text>
    <text x="160" y="145" fill="#4ade80" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="600">$324.5K</text>

    <line x1="14" y1="160" x2="216" y2="160" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="14" y="185" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="11">Central Retail</text>
    <text x="160" y="185" fill="#c8a85b" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="600">$218.0K</text>

    <line x1="14" y1="200" x2="216" y2="200" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="14" y="225" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="11">Export Operations</text>
    <text x="160" y="225" fill="#4ade80" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="600">$645.1K</text>

    <!-- Total Row -->
    <rect x="0" y="275" width="230" height="43" fill="#075b4d" fill-opacity="0.6" />
    <text x="14" y="302" fill="#ffffff" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700">Consolidated</text>
    <text x="145" y="302" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700">$1,667.8K</text>

    <!-- Right: Variance Bar Chart -->
    <rect x="245" y="48" width="275" height="270" rx="4" fill="#0a202d" fill-opacity="0.75" stroke="#dfe4e2" stroke-opacity="0.15" />
    <rect x="245" y="48" width="275" height="32" fill="#0a202d" />
    <text x="260" y="69" fill="#c8a85b" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">BUDGET VS. ACTUAL VARIANCE</text>

    <!-- Bars Group -->
    <g transform="translate(265, 100)">
      <!-- Q1 -->
      <text x="0" y="25" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600">Q1</text>
      <rect x="30" y="10" width="120" height="18" rx="2" fill="#ffffff" fill-opacity="0.2" />
      <rect x="30" y="10" width="138" height="18" rx="2" fill="#4ade80" />
      <text x="176" y="24" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700">+15%</text>

      <!-- Q2 -->
      <text x="0" y="65" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600">Q2</text>
      <rect x="30" y="50" width="140" height="18" rx="2" fill="#ffffff" fill-opacity="0.2" />
      <rect x="30" y="50" width="126" height="18" rx="2" fill="#c8a85b" />
      <text x="164" y="64" fill="#c8a85b" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700">-10%</text>

      <!-- Q3 -->
      <text x="0" y="105" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600">Q3</text>
      <rect x="30" y="90" width="130" height="18" rx="2" fill="#ffffff" fill-opacity="0.2" />
      <rect x="30" y="90" width="156" height="18" rx="2" fill="#4ade80" />
      <text x="194" y="104" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700">+20%</text>

      <!-- Q4 -->
      <text x="0" y="145" fill="#aebdc5" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="600">Q4</text>
      <rect x="30" y="130" width="150" height="18" rx="2" fill="#ffffff" fill-opacity="0.2" />
      <rect x="30" y="130" width="188" height="18" rx="2" fill="#4ade80" />
      <text x="226" y="144" fill="#4ade80" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="700">+25%</text>
    </g>
  </g>
</svg>
